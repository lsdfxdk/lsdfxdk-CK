vo=gpu
gpu-api=vulkan
hwdec=auto-safe
hwdec-codecs=hevc,h264,vp9
tone-mapping=hable
target-prim=bt.709
target-trc=bt.1886
target-peak=250
hdr-compute-peak=no
gamut-mapping-mode=clip
video-sync=audio
video-sync-max-video-change=4
deband=no
dither=no
scale=bilinear
cscale=bilinear
dscale=bilinear
cache=yes
cache-secs=10
demuxer-max-bytes=50M
demuxer-max-back-bytes=20M
demuxer-thread=yes
ffmpeg-threads=3