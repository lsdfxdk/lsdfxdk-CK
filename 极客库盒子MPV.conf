# WebHTV MPV default config
# Loaded by libmpv from files/mpv/mpv.conf. Keep Android-only output options in app code.

profile=fast
http-allow-redirect=yes
sub-ass=yes
sub-ass-override=scale
embeddedfonts=yes
sub-fix-timing=yes
sub-use-margins=yes
sub-font-provider=fontconfig
volume-max=100

# 优先安卓原生输出（WebHTV）
vo=android
gpu-context=android

# 如果上面被 APP 锁死失效，才试下面两行；一旦黑屏、闪屏就注释掉
# vo=gpu
# gpu-api=vulkan

# 安全硬解，只保留稳妥编码
hwdec=auto-safe
hwdec-codecs=hevc,h264,vp9

# 固定为 SDR（你的盒子 + 电视本身就是 SDR）
tone-mapping=hable
target-prim=bt.709
target-trc=bt.1886
target-peak=250
hdr-compute-peak=no
gamut-mapping-mode=relative

# “以音频为主”，杜绝音画不同步（这个盒子首选）
video-sync=audio
video-sync-max-video-change=4

# “折中缩放”：比 bilinear 清晰，又不会把 Mali‑G31 压垮
scale=lanczos
cscale=lanczos
dscale=mitchell

# 如果暗片出现明显色带就打开；一旦卡顿立刻关掉
deband=no
dither=no

# WebHTV：网络点播，加大缓存，防止网络抖动直接转圈
cache=yes
cache-secs=25
demuxer-max-bytes=64M
demuxer-max-back-bytes=24M
demuxer-thread=yes
# 删除固定 ffmpeg 线程，交给系统自动调度
